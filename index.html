<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            cursor: none;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 0, 50, 0.6);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.5);
        }

        .custom-cursor::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background-color: rgba(255, 50, 50, 0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .eyelid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 20;
            background-color: #000000;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
        }

        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 10;
            background: linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(20, 0, 0, 0.55) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 50, 0.05), rgba(0, 0, 0, 0.15), rgba(255, 0, 50, 0.05));
            background-size: 100% 3px, 4px 100%;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 11;
            box-shadow: inset 0 0 300px rgba(0, 0, 0, 0.98), inset 0 0 140px rgba(180, 0, 20, 0.7);
        }

        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 12;
            opacity: 0.18;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>');
        }

        /* Pure visual organic meat core menu (less gore, atmospheric shadow-breathing focal mass) */
        .meat-menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 500;
            background: radial-gradient(circle at center, rgba(18, 4, 7, 0.95) 0%, rgba(5, 1, 2, 0.98) 70%, #000 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            cursor: none;
        }

        .meat-menu-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .meat-panel {
            width: 380px;
            height: 380px;
            border-radius: 50%;
            background: 
                radial-gradient(circle at 40% 40%, rgba(140, 30, 45, 0.2) 0%, transparent 50%),
                radial-gradient(circle at center, rgba(60, 10, 18, 0.7) 0%, rgba(15, 3, 5, 0.95) 85%);
            border: 1px solid rgba(130, 20, 30, 0.35);
            box-shadow: 
                0 0 50px rgba(160, 0, 25, 0.2), 
                inset 0 0 50px rgba(50, 0, 10, 0.9),
                0 0 0 25px rgba(5, 1, 2, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: none;
            overflow: hidden;
            clip-path: circle(50% at center);
            transition: transform 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28), filter 0.2s ease, border-color 0.2s ease;
        }

        .meat-panel::before {
            content: '';
            position: absolute;
            inset: -15%;
            background: 
                radial-gradient(circle, rgba(180, 40, 55, 0.2) 0%, transparent 65%),
                repeating-conic-gradient(from 0deg, rgba(100, 15, 25, 0.08) 0deg 20deg, transparent 20deg 40deg);
            animation: organicPulse 5s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .meat-core-pupil {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(180, 25, 35, 0.7) 0%, rgba(40, 5, 10, 0.9) 70%, #030001 100%);
            box-shadow: 0 0 25px rgba(180, 0, 30, 0.5), inset 0 0 10px rgba(220, 100, 110, 0.3);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            position: relative;
            z-index: 2;
        }

        .meat-core-pupil::after {
            content: '';
            position: absolute;
            inset: 35%;
            border-radius: 50%;
            background: #000;
            box-shadow: inset 0 0 6px rgba(150, 0, 30, 0.5);
        }

        @keyframes organicPulse {
            0% { transform: scale(0.97) rotate(0deg); opacity: 0.7; }
            100% { transform: scale(1.04) rotate(4deg); opacity: 0.95; }
        }

        /* Enigmatic minimal drop zone */
        .printer-hud {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            width: 220px;
            background: rgba(10, 10, 10, 0.7);
            border: 1px solid rgba(255, 0, 0, 0.3);
            padding: 8px;
            font-family: monospace;
            color: rgba(255, 51, 51, 0.6);
            text-align: center;
            cursor: none;
        }

        .printer-hud.unlocked {
            border-color: rgba(0, 255, 100, 0.5);
            color: rgba(51, 255, 136, 0.7);
        }

        .drop-zone {
            border: 1px dashed rgba(255, 0, 0, 0.3);
            padding: 14px 8px;
            font-size: 0.7rem;
            background: rgba(255, 0, 0, 0.02);
            transition: all 0.2s;
            cursor: none;
            letter-spacing: 0.1em;
        }

        .drop-zone.dragover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .download-btn {
            display: none;
            margin-top: 6px;
            width: 100%;
            background: #001500;
            border: 1px solid rgba(51, 255, 136, 0.4);
            color: rgba(51, 255, 136, 0.8);
            padding: 6px;
            font-family: monospace;
            cursor: none;
            font-size: 0.65rem;
            letter-spacing: 0.05em;
        }

        .download-btn.active {
            display: block;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="custom-cursor" id="customCursor"></div>
    <div class="eyelid-overlay" id="eyelid"></div>
    <div class="crt-overlay" id="crtOverlay"></div>
    <div class="vignette" id="vignetteOverlay"></div>
    <div class="noise" id="noiseOverlay"></div>

    <div class="meat-menu-overlay" id="meatMenu">
        <div class="meat-panel" id="meatPanel">
            <div class="meat-core-pupil" id="meatPupil"></div>
        </div>
    </div>

    <div class="printer-hud" id="printerHud">
        <div class="drop-zone" id="dropZone">[ . . . ]</div>
        <button class="download-btn" id="downloadBtn">Understand.txt</button>
    </div>

    <audio id="bgMusic" src="All you are going to want to do is get back there (1).mp3" loop preload="auto"></audio>
    <audio id="breathSound" src="Slow breathing sound effect.mp3" loop preload="auto" volume="3.0"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Anti-inspection / anti-tamper defensive hardening
        (function() {
            window.addEventListener('keydown', (e) => {
                if (
                    e.key === 'F12' ||
                    (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
                    (e.ctrlKey && e.key.toUpperCase() === 'U') ||
                    (e.ctrlKey && e.key.toUpperCase() === 'S') ||
                    (e.ctrlKey && ['=', '-', '+', '0', 'NumPadAdd', 'NumPadSubtract'].includes(e.key))
                ) {
                    e.preventDefault();
                    return false;
                }
            }, true);

            // Block wheel/pinch zoom attempts
            window.addEventListener('wheel', (e) => {
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                }
            }, { passive: false });

            window.addEventListener('gesturestart', (e) => e.preventDefault(), true);
            window.addEventListener('gesturechange', (e) => e.preventDefault(), true);

            // Periodic debugger trap / obfuscation check
            setInterval(() => {
                const start = performance.now();
                debugger;
                const delta = performance.now() - start;
                if (delta > 100) {
                    document.body.innerHTML = '';
                    window.location.reload();
                }
            }, 2500);

            Object.freeze(window.performance);
        })();

        const cursorEl = document.getElementById('customCursor');
        window.addEventListener('mousemove', (e) => {
            cursorEl.style.left = e.clientX + 'px';
            cursorEl.style.top = e.clientY + 'px';
            document.body.style.cursor = 'none';
        });

        // Hide default system cursor completely across window bounds
        document.addEventListener('mouseleave', () => {
            cursorEl.style.opacity = '0';
        });
        document.addEventListener('mouseenter', () => {
            cursorEl.style.opacity = '1';
        });

        // Audio initialization (active ONLY after menu tear complete)
        let audioStarted = false;
        const bgMusic = document.getElementById('bgMusic');
        const breathSound = document.getElementById('breathSound');
        bgMusic.volume = 0.4;
        bgMusic.playbackRate = 0.85;
        breathSound.volume = 1.0;

        function startAudio() {
            if (!audioStarted) {
                audioStarted = true;
                bgMusic.play().catch(e => {});
                breathSound.play().catch(e => {});
            }
        }

        // Pure visual meat sphincter / membrane tearing state (less gore, zero text)
        let tearCount = 0;
        const maxTears = 5;
        let lastClickTime = 0;
        const cooldownMs = 2200;
        const meatMenuEl = document.getElementById('meatMenu');
        const meatPanelEl = document.getElementById('meatPanel');
        const meatPupilEl = document.getElementById('meatPupil');

        const tearClipPaths = [
            'circle(50% at center)',
            'polygon(12% 10%, 90% 8%, 86% 92%, 10% 88%)',
            'polygon(22% 18%, 80% 14%, 75% 85%, 20% 82%)',
            'polygon(34% 30%, 68% 28%, 64% 70%, 30% 68%)',
            'polygon(44% 42%, 56% 44%, 54% 56%, 43% 54%)',
            'polygon(50% 50%, 50% 50%, 50% 50%, 50% 50%)'
        ];

        meatPanelEl.addEventListener('click', () => {
            const now = performance.now();
            if (now - lastClickTime < cooldownMs) {
                meatPanelEl.style.transform = `scale(0.93) translateX(${(Math.random() - 0.5) * 10}px)`;
                setTimeout(() => {
                    meatPanelEl.style.transform = 'scale(1) translateX(0)';
                }, 100);
                return;
            }

            lastClickTime = now;
            tearCount++;

            const progress = tearCount / maxTears;
            meatPanelEl.style.clipPath = tearClipPaths[tearCount] || tearClipPaths[tearClipPaths.length - 1];
            meatPanelEl.style.transform = `scale(${1 - progress * 0.18}) rotate(${(Math.random() - 0.5) * 12}deg)`;
            meatPanelEl.style.filter = `hue-rotate(${tearCount * 25}deg) contrast(${1 + progress * 1.5}) brightness(${1 - progress * 0.2})`;
            meatPupilEl.style.transform = `scale(${1 + progress * 0.6}) translate(${(Math.random() - 0.5) * 10}px, ${(Math.random() - 0.5) * 10}px)`;
            meatPupilEl.style.boxShadow = `0 0 ${25 + tearCount * 12}px rgba(180, 0, 30, ${0.5 + progress * 0.3})`;

            if (tearCount >= maxTears) {
                meatPanelEl.style.transform = 'scale(0) rotate(180deg)';
                meatPanelEl.style.opacity = '0';
                setTimeout(() => {
                    meatMenuEl.classList.add('hidden');
                    startAudio();
                }, 500);
            }
        });

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x060606);
        scene.fog = new THREE.FogExp2(0x030303, 0.010);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.8, 8);
        camera.lookAt(0, 1.8, -45);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.35;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x181012, 0.7);
        scene.add(ambientLight);

        function createBWLimboGroundTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#111010';
            ctx.fillRect(0, 0, 1024, 1024);

            for (let i = 0; i < 4000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#0b0a0a' : '#1c1819';
                ctx.beginPath();
                ctx.arc(Math.random() * 1024, Math.random() * 1024, Math.random() * 8 + 1, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.strokeStyle = '#060505';
            ctx.lineWidth = 3;
            for (let i = 0; i < 1024; i += 64) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, 1024);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(1024, i);
                ctx.stroke();
            }

            return new THREE.CanvasTexture(canvas);
        }

        const groundTex = createBWLimboGroundTexture();
        groundTex.wrapS = THREE.RepeatWrapping;
        groundTex.wrapT = THREE.RepeatWrapping;
        groundTex.repeat.set(40, 40);

        const groundMat = new THREE.MeshStandardMaterial({ 
            map: groundTex, 
            roughness: 0.85,
            metalness: 0.15
        });

        const groundGeo = new THREE.PlaneGeometry(500, 500, 64, 64);
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -2;
        scene.add(ground);

        const pathMat = new THREE.MeshStandardMaterial({ color: 0x140a0b, roughness: 0.85, metalness: 0.1 });
        const pathGeo = new THREE.PlaneGeometry(8, 500);
        const path = new THREE.Mesh(pathGeo, pathMat);
        path.rotation.x = -Math.PI / 2;
        path.position.y = -1.94;
        scene.add(path);

        const crossGroup = new THREE.Group();
        const crossMat = new THREE.MeshStandardMaterial({ 
            color: 0x2b0507, 
            roughness: 0.08, 
            metalness: 0.7,
            emissive: 0xff002b,
            emissiveIntensity: 22.0
        });

        const verticalBeamGeo = new THREE.BoxGeometry(3.6, 38, 3.2);
        const verticalBeam = new THREE.Mesh(verticalBeamGeo, crossMat);
        verticalBeam.position.y = 15;
        crossGroup.add(verticalBeam);

        const horizontalBeamGeo = new THREE.BoxGeometry(22, 3.6, 3.2);
        const horizontalBeam = new THREE.Mesh(horizontalBeamGeo, crossMat);
        horizontalBeam.position.y = 25;
        crossGroup.add(horizontalBeam);

        function create62Texture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 512, 512);
            ctx.font = 'bold 220px monospace';
            ctx.fillStyle = '#ff3355';
            ctx.shadowColor = '#ff0000';
            ctx.shadowBlur = 30;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('62', 256, 256);
            const tex = new THREE.CanvasTexture(canvas);
            tex.needsUpdate = true;
            return tex;
        }
        const text62Geo = new THREE.PlaneGeometry(8, 8);
        const text62Mat = new THREE.MeshBasicMaterial({ 
            map: create62Texture(), 
            transparent: true,
            side: THREE.DoubleSide
        });
        const text62Mesh = new THREE.Mesh(text62Geo, text62Mat);
        text62Mesh.position.set(0, 20, 1.68);
        crossGroup.add(text62Mesh);

        const goreMat = new THREE.MeshStandardMaterial({
            color: 0x660a12,
            roughness: 0.2,
            metalness: 0.3,
            emissive: 0x99001a,
            emissiveIntensity: 3.5
        });
        for (let g = 0; g < 14; g++) {
            const dripGeo = new THREE.CylinderGeometry(0.08, 0.25, Math.random() * 12 + 6, 8);
            const drip = new THREE.Mesh(dripGeo, goreMat);
            drip.position.set((Math.random() - 0.5) * 16, 12 + Math.random() * 10, (Math.random() - 0.5) * 1.5);
            crossGroup.add(drip);
        }

        const redGlow = new THREE.PointLight(0xff0022, 280, 320);
        redGlow.position.set(0, 20, -50);
        scene.add(redGlow);

        crossGroup.position.set(0, 0, -65);
        scene.add(crossGroup);

        const particleCount = 900;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            particlePositions[i] = (Math.random() - 0.5) * 100;
            particlePositions[i + 1] = Math.random() * 40 - 2;
            particlePositions[i + 2] = (Math.random() - 0.5) * 140;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0x662228,
            size: 0.35,
            transparent: true,
            opacity: 0.75
        });
        const spores = new THREE.Points(particleGeo, particleMat);
        scene.add(spores);
        window.sporesRef = spores;

        const bubbleCount = 45;
        const bubbles = [];
        const bubbleGeo = new THREE.RingGeometry(0.35, 0.45, 16);
        const bubbleMat = new THREE.MeshBasicMaterial({ color: 0x661118, side: THREE.DoubleSide, transparent: true, opacity: 0.45 });

        for (let b = 0; b < bubbleCount; b++) {
            const bubble = new THREE.Mesh(bubbleGeo, bubbleMat);
            bubble.position.set(
                (Math.random() - 0.5) * 60,
                Math.random() * 25 - 2,
                (Math.random() - 0.5) * 80
            );
            bubble.rotation.x = Math.PI / 2;
            scene.add(bubble);
            bubbles.push({ mesh: bubble, speed: Math.random() * 0.035 + 0.015, wobble: Math.random() * 2 });
        }
        window.bubblesRef = bubbles;

        const eyelidEl = document.getElementById('eyelid');
        let lastBlinkTime = 0;
        let isBlinking = false;

        function triggerBlink() {
            if (isBlinking) return;
            isBlinking = true;
            eyelidEl.style.opacity = '1';
            setTimeout(() => {
                eyelidEl.style.opacity = '0';
                isBlinking = false;
            }, 180);
        }

        let clock = new THREE.Clock();
        const initialCameraPosition = camera.position.clone();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            if (elapsedTime - lastBlinkTime > 5.5) {
                triggerBlink();
                lastBlinkTime = elapsedTime;
            }

            camera.position.x = initialCameraPosition.x + Math.sin(elapsedTime * 0.8) * 0.25;
            camera.position.y = initialCameraPosition.y + Math.cos(elapsedTime * 0.5) * 0.15;

            if (window.sporesRef) {
                const positions = window.sporesRef.geometry.attributes.position.array;
                for (let i = 1; i < positions.length; i += 3) {
                    positions[i] += Math.sin(elapsedTime + i) * 0.018;
                    positions[i - 1] += Math.cos(elapsedTime + 0.4 * i) * 0.01;
                }
                window.sporesRef.geometry.attributes.position.needsUpdate = true;
            }

            if (window.bubblesRef) {
                window.bubblesRef.forEach(item => {
                    item.mesh.position.y += item.speed;
                    item.mesh.position.x += Math.sin(elapsedTime + item.wobble) * 0.012;
                    if (item.mesh.position.y > 30) {
                        item.mesh.position.y = -2;
                    }
                });
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Obfuscated client-side check preventing trivial source readout extraction of payload/keys
        const _k = [0x69, 0x20, 0x63, 0x61, 0x6e, 0x27, 0x74, 0x20, 0x72, 0x65, 0x6d, 0x65, 0x6d, 0x62, 0x65, 0x72];
        const _out = [
            0x79, 0x6f, 0x75, 0x27, 0x72, 0x65, 0x20, 0x6e, 0x6f, 0x74, 0x20, 0x69, 0x6e, 0x20, 0x74, 0x68, 0x65, 0x20, 0x72, 0x69, 0x67, 0x68, 0x74, 0x20, 0x70, 0x6c, 0x61, 0x63, 0x65, 0x0a, 
            0x79, 0x6f, 0x75, 0x27, 0x72, 0x65, 0x20, 0x73, 0x74, 0x61, 0x72, 0x74, 0x69, 0x6e, 0x67, 0x20, 0x74, 0x6f, 0x20, 0x75, 0x6e, 0x64, 0x65, 0x72, 0x73, 0x74, 0x61, 0x6e, 0x64, 0x0a, 
            0x68, 0x74, 0x74, 0x70, 0x73, 0x3a, 0x2f, 0x2f, 0x68, 0x61, 0x6d, 0x7a, 0x61, 0x62, 0x65, 0x6c, 0x61, 0x69, 0x64, 0x39, 0x32, 0x31, 0x34, 0x30, 0x2d, 0x6e, 0x65, 0x74, 0x69, 0x7a, 0x65, 0x6e, 0x2e, 0x67, 0x69, 0x74, 0x68, 0x75, 0x62, 0x2e, 0x69, 0x6f, 0x2f, 0x66, 0x69, 0x6e, 0x61, 0x6c, 0x2d, 0x64, 0x72, 0x65, 0x61, 0x6d, 0x2f
        ];
        function _decode(arr) { return arr.map(c => String.fromCharCode(c)).join(''); }

        let printerUnlocked = false;
        const hudEl = document.getElementById('printerHud');
        const dropZoneEl = document.getElementById('dropZone');
        const downloadBtnEl = document.getElementById('downloadBtn');

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZoneEl.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZoneEl.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZoneEl.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZoneEl.classList.remove('dragover');
            }, false);
        });

        dropZoneEl.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length === 0) return;
            const file = files[0];
            const fileName = file.name.trim().toLowerCase();

            if (fileName !== 'memory.txt') return;

            const reader = new FileReader();
            reader.onload = function(evt) {
